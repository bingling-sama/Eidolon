[package]
name = "eidolon-wasm"
version.workspace = true
description = "WebAssembly bindings for Eidolon Minecraft skin renderer"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "eidolon"
crate-type = ["cdylib", "rlib"]

[dependencies]
eidolon-core = { workspace = true, features = ["webgl"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_log.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
image = { workspace = true, features = ["png", "webp", "jpeg"] }
log.workspace = true
wgpu = { workspace = true, features = ["webgl"] }
