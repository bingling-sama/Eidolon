[package]
name = "eidolon-wasm"
version = "0.0.1-alpha"
description = "WebAssembly bindings for Eidolon Minecraft skin renderer"
edition = "2021"
license-file = "../../LICENSE"
homepage = "https://github.com/bingling-sama/eidolon"
repository = "https://github.com/bingling-sama/eidolon"

[lib]
name = "eidolon"
crate-type = ["cdylib", "rlib"]

[dependencies]
eidolon-core = { path = "../core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
image = { version = "0.25.5", default-features = false, features = ["png", "webp", "jpeg"] }
log = "0.4"
wgpu = "25"
