[package]
name = "eidolon-cli"
version = "0.0.1-alpha"
description = "Minecraft skin renderer CLI"
edition = "2021"
license-file = "../../LICENSE"
homepage = "https://github.com/bingling-sama/eidolon"
repository = "https://github.com/bingling-sama/eidolon"

[[bin]]
name = "eidolon"
path = "src/main.rs"

[dependencies]
eidolon-core = { path = "../core", features = ["winit"] }
clap = { version = "4.5", features = ["derive"] }
cgmath = "0.18.0"
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
wgpu = "25"
winit = "0.30"
