[package]
name = "eidolon-cli"
version.workspace = true
description = "Minecraft skin renderer CLI"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "eidolon"
path = "src/main.rs"

[dependencies]
eidolon-core = { path = "../core", features = ["winit"] }
clap = { version = "4.5", features = ["derive"] }
cgmath = "0.18.0"
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
wgpu = "25"
winit = "0.30"
