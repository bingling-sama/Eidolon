[package]
name = "eidolon-core"
version.workspace = true
description = "A Minecraft skin off-screen renderer core engine written in Rust"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "eidolon_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bench]]
name = "performance_benchmark"
harness = false

[features]
default = []
winit = ["dep:winit"]

[dependencies]
ab_glyph = "0.2"
log = "0.4"
wgpu = "25"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = "0.25.5"
cgmath = "0.18.0"
tobj = "4.0.2"
winit = { version = "0.30", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gif = "0.13.3"
webp-animation = "0.10.0"
png = "0.17"
zenravif = { version = "0.1.3", default-features = false, features = ["threading"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
