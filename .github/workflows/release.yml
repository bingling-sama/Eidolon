name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tag runs can only restore caches from main, so reuse CI's rust-test cache
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test
          save-if: false

      - name: Install software graphics drivers
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libgl1-mesa-dri mesa-vulkan-drivers libosmesa6-dev
          version: mesa-v1

      - name: Run workspace tests
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: cargo test --workspace --tests -- --test-threads=1

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            binary: eidolon
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            binary: eidolon
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
            binary: eidolon
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            binary: eidolon.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        # The 0.2.5 release image ships a GCC too old for libwebp's NEON intrinsics; use git main
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p eidolon-cli
          else
            cargo build --release --target ${{ matrix.target }} -p eidolon-cli
          fi
        shell: bash

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_DIR="eidolon-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$ARCHIVE_DIR/"
          cp README.md LICENSE "$ARCHIVE_DIR/" 2>/dev/null || true
          tar -czf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
          sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"
          mkdir -p dist
          mv "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}.tar.gz.sha256" dist/

      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          ARCHIVE_DIR="eidolon-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$ARCHIVE_DIR/"
          cp README.md LICENSE "$ARCHIVE_DIR/" 2>/dev/null || true
          7z a "${ARCHIVE_DIR}.zip" "$ARCHIVE_DIR"
          certutil -hashfile "${ARCHIVE_DIR}.zip" SHA256 | findstr -v "hash" | findstr -v "CertUtil" > "${ARCHIVE_DIR}.zip.sha256"
          mkdir -p dist
          mv "${ARCHIVE_DIR}.zip" "${ARCHIVE_DIR}.zip.sha256" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-npm:
    name: Publish WASM to NPM
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: false
          workspaces: |
            .
            examples/wasm

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM package
        run: pnpm build:wasm

      - name: Publish to NPM
        run: pnpm --filter @eidolonmc/wasm publish --access public --no-git-checks

  publish-crates:
    name: Publish to Crates.io
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # cargo publish compiles each crate to verify it; reuse CI's debug build cache
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-test
          save-if: false

      - name: Authenticate with crates.io (OIDC Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
        continue-on-error: true

      - name: Publish eidolon-core and eidolon-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo publish -p eidolon-core --token "$CARGO_REGISTRY_TOKEN"
          echo "Waiting 25 seconds for crates.io index propagation..."
          sleep 25
          cargo publish -p eidolon-cli --token "$CARGO_REGISTRY_TOKEN"

  github-release:
    name: Create GitHub Release
    needs: [validate, build-cli, publish-npm, publish-crates]
    if: always() && needs.validate.result == 'success' && needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Release Notes using git-cliff
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
