name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: eidolon
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: eidolon
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: eidolon
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: eidolon.exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI release binary
        run: cargo build --release --bin eidolon --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/
          tar -czf eidolon-${{ matrix.target }}.tar.gz -C dist ${{ matrix.bin_name }}

      - name: Package artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/
          Compress-Archive -Path dist/${{ matrix.bin_name }} -DestinationPath eidolon-${{ matrix.target }}.zip

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eidolon-${{ matrix.target }}.tar.gz
            eidolon-${{ matrix.target }}.zip

  publish-docker:
    name: Build & Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
