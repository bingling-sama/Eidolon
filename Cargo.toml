[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/wasm",
    "examples/rust",
    "examples/server",
]
resolver = "2"

[workspace.package]
version = "0.0.1-alpha"
edition = "2021"
license = "MIT"
homepage = "https://github.com/bingling-sama/eidolon"
repository = "https://github.com/bingling-sama/eidolon"

[workspace.dependencies]
# Workspace crates
eidolon-core = { path = "crates/core" }

# Graphics and system
wgpu = "30"
winit = "0.30"
pollster = "1.0"
bytemuck = { version = "1", features = ["derive"] }
cgmath = "0.18"
image = { version = "0.25", default-features = false }
tobj = "4.0"
ab_glyph = "0.2"

# Encoding formats
gif = "0.14"
png = "0.18"
webp-animation = "0.10.0"
zenravif = { version = "0.1.3", default-features = false, features = ["threading"] }

# CLI and utilities
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

# Web / Server / Async
futures-channel = "0.3"
getrandom = "0.3"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
moka = { version = "0.12", features = ["future"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
crossbeam-channel = "0.5"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1"
console_error_panic_hook = "0.1.7"
web-sys = "0.3"

# Dev dependencies
criterion = "0.8"
